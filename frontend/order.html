<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Order — Knite</title>
  <link rel="icon" type="image/x-icon" href="https://knite.in/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="https://knite.in/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="https://knite.in/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://knite.in/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://knite.in/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="https://knite.in/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="https://knite.in/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0a1628;line-height:1.55}
    a{color:inherit;text-decoration:none}

    .nav{background:#0a1628;color:#fff;padding:14px 24px}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:3px}

    .wrap{max-width:780px;margin:0 auto;padding:40px 24px 80px}

    .hero{background:linear-gradient(135deg,#0a1628 0%,#0369a1 100%);color:#fff;padding:36px;border-radius:20px;margin-bottom:24px}
    .hero h1{font-family:Poppins;font-size:30px;font-weight:800;margin-bottom:6px}
    .hero .num{font-family:Poppins;font-size:14px;opacity:0.85;letter-spacing:2px}
    .hero .badge{display:inline-block;margin-top:14px;background:rgba(255,255,255,0.15);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;backdrop-filter:blur(8px)}

    .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-bottom:18px}
    .card h2{font-family:Poppins;font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;color:#475569}

    .timeline{position:relative;padding-left:24px}
    .timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#e2e8f0}
    .step{position:relative;padding-bottom:18px}
    .step:last-child{padding-bottom:0}
    .step::before{content:'';position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #cbd5e1}
    .step.done::before{background:#16a34a;border-color:#16a34a}
    .step.done::after{content:'✓';position:absolute;left:-19px;top:1px;color:#fff;font-size:9px;font-weight:800}
    .step.active::before{background:#00b4d8;border-color:#00b4d8;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,180,216,0.4)}50%{box-shadow:0 0 0 6px rgba(0,180,216,0)}}
    .step-title{font-family:Poppins;font-weight:600;font-size:14px;color:#0a1628}
    .step-date{font-size:11px;color:#94a3b8;margin-top:2px}
    .step.future .step-title{color:#94a3b8}

    .item-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
    .item-row:last-child{border-bottom:none}
    .item-row .name{font-weight:500}
    .item-row .qty{color:#94a3b8;font-size:12px;margin-left:4px}

    .totals{margin-top:10px}
    .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#475569}
    .row.total{font-family:Poppins;font-weight:800;font-size:17px;color:#0a1628;border-top:1px solid #e2e8f0;margin-top:8px;padding-top:12px}

    .addr{font-size:14px;color:#475569;line-height:1.6}
    .addr strong{color:#0a1628;display:block;margin-bottom:4px}

    .help{background:#f0f9ff;border:1px solid #bae6fd;border-radius:14px;padding:18px;font-size:13px;color:#075985}
    .help strong{display:block;margin-bottom:6px;font-family:Poppins;font-size:13px}
    .help a{color:#0369a1;font-weight:600}

    .lookup{max-width:480px;margin:0 auto}
    .lookup h1{font-family:Poppins;font-size:26px;margin-bottom:8px}
    .lookup p{color:#64748b;margin-bottom:20px}
    .lookup-form{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:#475569;font-weight:600;margin-bottom:6px}
    .field input{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
    .field input:focus{outline:none;border-color:#00b4d8;box-shadow:0 0 0 3px rgba(0,180,216,0.15)}
    .btn-track{background:#0a1628;color:#fff;padding:12px 20px;border-radius:8px;border:none;font-weight:600;cursor:pointer;width:100%}

    .new-banner{background:linear-gradient(135deg,#dcfce7,#f0fdf4);border:1px solid #86efac;color:#065f46;padding:14px 18px;border-radius:12px;margin-bottom:18px;font-size:14px}

    .loading{padding:60px;text-align:center;color:#94a3b8}
    .error{padding:40px;text-align:center;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:14px}
  </style>
  <script src="/nav.js" defer></script>
</head>
<body>

<div id="knite-nav"></div>

<div class="wrap" id="root"><div class="loading">Loading order…</div></div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');

const STATUS_FLOW = [
  { key: 'pending',    label: 'Order Placed' },
  { key: 'confirmed',  label: 'Order Confirmed' },
  { key: 'processing', label: 'Packed' },
  { key: 'shipped',    label: 'Shipped' },
  { key: 'delivered',  label: 'Delivered' },
];

async function init(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const phone = params.get('phone');
  const isNew = params.get('new') === '1';

  if(!id || !phone){
    renderLookup();
    return;
  }
  try {
    const r = await fetch(`/api/shop/orders/${id}?phone=${phone}`);
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      throw new Error(e.error || 'Order not found');
    }
    const data = await r.json();
    render(data, isNew);
  } catch (err) {
    document.getElementById('root').innerHTML = '<div class="error">' + err.message + '</div>';
  }
}

function renderLookup(){
  document.getElementById('root').innerHTML = `
    <div class="lookup">
      <h1>Track your order</h1>
      <p>Enter your order ID and phone number to track shipment status.</p>
      <form class="lookup-form" onsubmit="trackOrder(event)">
        <div class="field"><label>Order ID</label><input name="id" required placeholder="e.g. 42"></div>
        <div class="field"><label>Phone (10 digits)</label><input name="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="9876543210"></div>
        <button class="btn-track" type="submit">Track Order →</button>
      </form>
    </div>`;
}

function trackOrder(e){
  e.preventDefault();
  const f = new FormData(e.target);
  window.location.href = `/order.html?id=${f.get('id')}&phone=${f.get('phone')}`;
}

function render(order, isNew){
  const dt = d => d ? new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}) : '';
  const addr = order.shipping_address || {};

  // Build timeline
  const status = order.status || 'pending';
  const cancelled = status === 'cancelled';
  let activeIdx = STATUS_FLOW.findIndex(s => s.key === status);
  if(activeIdx < 0) activeIdx = 0;

  const timeline = STATUS_FLOW.map((s, i) => {
    let cls = 'future';
    if(cancelled) cls = i === 0 ? 'done' : 'future';
    else if(i < activeIdx) cls = 'done';
    else if(i === activeIdx) cls = 'active';
    const dateField = {pending:'created_at',confirmed:'created_at',processing:'paid_at',shipped:'shipped_at',delivered:'delivered_at'}[s.key];
    return `<div class="step ${cls}">
      <div class="step-title">${s.label}</div>
      ${cls!=='future' && order[dateField] ? `<div class="step-date">${dt(order[dateField])}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('root').innerHTML = `
    ${isNew ? `<div class="new-banner">🎉 <strong>Thank you for your order!</strong> A confirmation has been sent to your WhatsApp.</div>` : ''}

    <div class="hero">
      <div class="num">ORDER ${order.order_number}</div>
      <h1>${cancelled ? 'Order Cancelled' : (status === 'delivered' ? 'Delivered ✓' : 'Order in Progress')}</h1>
      <div class="badge">${order.payment_method === 'cod' ? 'Cash on Delivery' : order.payment_method.toUpperCase()} · ${order.payment_status}</div>
    </div>

    ${cancelled ? '' : `
      <div class="card">
        <h2>Status</h2>
        <div class="timeline">${timeline}</div>
        ${order.tracking_number ? `<div style="margin-top:18px;font-size:13px;color:#475569;background:#f0f9ff;padding:12px;border-radius:8px">📦 <strong>Tracking:</strong> ${order.tracking_number} (${order.shipping_carrier || 'Courier'})</div>` : ''}
      </div>
    `}

    <div class="card">
      <h2>Items</h2>
      ${(order.items||[]).map(i => `
        <div class="item-row">
          <div class="name">${i.product_name}<span class="qty">× ${i.quantity}</span></div>
          <div>${FMT(i.line_total)}</div>
        </div>`).join('')}
      <div class="totals">
        <div class="row"><span>Subtotal</span><span>${FMT(order.subtotal)}</span></div>
        <div class="row"><span>GST</span><span>${FMT(order.tax_amount)}</span></div>
        <div class="row"><span>Shipping</span><span>${order.shipping_amount > 0 ? FMT(order.shipping_amount) : 'FREE'}</span></div>
        <div class="row total"><span>Total</span><span>${FMT(order.total_amount)}</span></div>
      </div>
    </div>

    ${order.invoice_url ? `
      <div class="card" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#86efac">
        <h2 style="color:#065f46">📄 GST Invoice</h2>
        <div style="font-size:13px;color:#065f46;margin-bottom:14px">
          Invoice <strong>${order.invoice_number || ''}</strong> · generated for your records.
        </div>
        <a href="${order.invoice_url}" target="_blank" rel="noopener"
           style="display:inline-block;background:#065f46;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none">
          ⬇ Download Invoice (PDF)
        </a>
      </div>
    ` : ''}

    <div class="card">
      <h2>Shipping Address</h2>
      <div class="addr">
        <strong>${addr.full_name || order.customer_name}</strong>
        ${addr.line1 || ''}${addr.line2 ? '<br>'+addr.line2 : ''}<br>
        ${addr.city || ''}, ${addr.state || ''} ${addr.pincode || ''}<br>
        +91 ${order.customer_phone}<br>
        ${order.customer_email}
      </div>
    </div>

    <div class="help">
      <strong>Need help?</strong>
      WhatsApp <a href="https://wa.me/919196068335">+91 91960 68335</a> · Email <a href="mailto:support@knite.in">support@knite.in</a>
    </div>
  `;
}

init();

// Auth-aware nav chip
fetch('/api/shop/me').then(r => r.json()).then(d => {
  if (d.logged_in) {
    var _al = document.getElementById('account-link'); if (_al) _al.href = '/account.html';
    var _alb = document.getElementById('account-label'); if (_alb) _alb.textContent = d.customer.name ? d.customer.name.split(' ')[0] : 'Account';
  }
}).catch(()=>{});
</script>
</body>
</html>
