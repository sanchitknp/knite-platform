<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Knite — RO Water Purifiers</title>
  <meta name="description" content="Shop Knite RO water purifiers online — premium 7-stage purification with free installation across India.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0a1628;line-height:1.55}
    a{color:inherit;text-decoration:none}

    /* Top nav */
    .nav{position:sticky;top:0;background:#0a1628;color:#fff;padding:14px 24px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:3px}
    .nav-links{display:flex;gap:24px;align-items:center;font-size:14px}
    .nav-links a:hover{color:#00b4d8}
    .cart-btn{background:rgba(255,255,255,0.08);padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.12);cursor:pointer;color:#fff;font-size:13px}
    .cart-btn:hover{background:rgba(255,255,255,0.14)}
    .cart-count{background:#00b4d8;color:#fff;font-weight:700;border-radius:99px;padding:2px 8px;font-size:11px;min-width:22px;text-align:center}

    /* Hero */
    .hero{padding:60px 24px 40px;background:linear-gradient(135deg,#f0f9ff 0%,#f8fafc 70%);text-align:center}
    .hero h1{font-family:Poppins;font-size:42px;font-weight:800;margin-bottom:10px}
    .hero p{color:#475569;font-size:17px;max-width:680px;margin:0 auto}
    .hero h1 span{background:linear-gradient(135deg,#00b4d8,#0369a1);-webkit-background-clip:text;background-clip:text;color:transparent}

    /* Products grid */
    .shop{max-width:1200px;margin:0 auto;padding:48px 24px 80px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}

    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;transition:all .25s ease;display:flex;flex-direction:column}
    .card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(10,22,40,0.10);border-color:#00b4d8}

    .card-img{background:linear-gradient(135deg,#dbeafe,#e0f2fe);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .card-img svg{width:55%;height:auto}
    .badge-featured{position:absolute;top:14px;left:14px;background:#0a1628;color:#fff;font-size:10px;letter-spacing:1.5px;padding:5px 10px;border-radius:99px;font-weight:600;text-transform:uppercase}
    .badge-stock-low{position:absolute;top:14px;right:14px;background:#fef3c7;color:#92400e;font-size:11px;padding:5px 10px;border-radius:99px;font-weight:600}
    .badge-out{position:absolute;top:14px;right:14px;background:#fee2e2;color:#991b1b;font-size:11px;padding:5px 10px;border-radius:99px;font-weight:600}

    .card-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
    .card-title{font-family:Poppins;font-size:17px;font-weight:700;color:#0a1628;line-height:1.3}
    .card-desc{font-size:13px;color:#64748b;flex:1}
    .card-price{display:flex;align-items:baseline;gap:10px;margin-top:6px}
    .price-now{font-family:Poppins;font-size:24px;font-weight:800;color:#0a1628}
    .price-mrp{font-size:14px;color:#94a3b8;text-decoration:line-through}
    .price-off{font-size:11px;background:#dcfce7;color:#166534;padding:2px 8px;border-radius:6px;font-weight:600}

    .card-actions{display:flex;gap:8px;margin-top:8px}
    .btn{padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-align:center;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn-primary{background:#0a1628;color:#fff;flex:1}
    .btn-primary:hover{background:#0369a1}
    .btn-secondary{background:#f1f5f9;color:#0a1628;border:1px solid #e2e8f0}
    .btn-secondary:hover{background:#e2e8f0}
    .btn:disabled{opacity:0.5;cursor:not-allowed}

    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0a1628;color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.20);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);z-index:200}
    .toast.show{transform:translateX(-50%) translateY(0)}

    .loading{text-align:center;padding:60px;color:#94a3b8}

    @media(max-width:640px){
      .hero h1{font-size:32px}
      .grid{grid-template-columns:1fr}
      .nav-links a:not(.cart-btn){display:none}
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a href="/" class="nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="navBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0f2b4a"/><stop offset="100%" stop-color="#020617"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="32" fill="url(#navBg)"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#00b4d8" stroke-width="0.9" stroke-opacity="0.55"/>
        <text x="32" y="42" text-anchor="middle" font-family="Poppins,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" letter-spacing="-2" fill="#fff">KN</text>
      </svg>
      KNITE<span style="color:#00b4d8">.</span>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/shop.html">Shop</a>
      <a href="/#coverage">Coverage</a>
      <a href="/#faq">FAQ</a>
      <a href="/cart.html" class="cart-btn">
        🛒 <span>Cart</span> <span class="cart-count" id="cart-count">0</span>
      </a>
      <a id="account-link" href="/login.html" class="cart-btn" style="margin-left:8px">
        👤 <span id="account-label">Sign in</span>
      </a>
    </div>
  </div>
</nav>

<section class="hero">
  <h1>Shop <span>Knite</span></h1>
  <p>Premium RO purifiers with free pan-India installation. Order online, pay on delivery.</p>
</section>

<main class="shop">
  <div class="grid" id="products-grid">
    <div class="loading">Loading products…</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');
const PLACEHOLDER_SVG = `
  <svg viewBox="0 0 140 180" fill="none">
    <rect x="35" y="20" width="70" height="140" rx="8" fill="#fff" stroke="#0a1628" stroke-width="2"/>
    <rect x="48" y="35" width="44" height="60" rx="6" fill="url(#waterFill)"/>
    <circle cx="70" cy="115" r="12" fill="#0a1628"/>
    <text x="70" y="120" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="700" font-size="10">KN</text>
    <defs>
      <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>
    </defs>
  </svg>`;

// ── Cart (localStorage) ──
const CART_KEY = 'knite_cart_v1';
function getCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; } }
function setCart(items) { localStorage.setItem(CART_KEY, JSON.stringify(items)); updateCartCount(); }
function updateCartCount() {
  const total = getCart().reduce((s, i) => s + (i.quantity || 0), 0);
  document.getElementById('cart-count').textContent = total;
}
function addToCart(slug, qty = 1) {
  const cart = getCart();
  const existing = cart.find(i => i.slug === slug);
  if (existing) existing.quantity = Math.min(5, existing.quantity + qty);
  else cart.push({ slug, quantity: qty });
  setCart(cart);
  showToast('Added to cart');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Load products ──
async function loadProducts() {
  try {
    const r = await fetch('/api/shop/products');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const products = await r.json();
    renderProducts(products);
  } catch (err) {
    document.getElementById('products-grid').innerHTML =
      '<div class="loading">Could not load products. ' + err.message + '</div>';
  }
}

function renderProducts(products) {
  const grid = document.getElementById('products-grid');
  if (!products.length) { grid.innerHTML = '<div class="loading">No products yet.</div>'; return; }

  grid.innerHTML = products.map(p => {
    const discount = p.mrp > p.selling_price
      ? Math.round(((p.mrp - p.selling_price) / p.mrp) * 100)
      : 0;
    const out = p.stock <= 0;
    const low = p.stock > 0 && p.stock < 5;
    return `
      <a href="/product.html?slug=${p.slug}" class="card">
        <div class="card-img">
          ${p.is_featured ? '<div class="badge-featured">Bestseller</div>' : ''}
          ${out ? '<div class="badge-out">Out of stock</div>' : low ? `<div class="badge-stock-low">Only ${p.stock} left</div>` : ''}
          ${PLACEHOLDER_SVG}
        </div>
        <div class="card-body">
          <div class="card-title">${p.name}</div>
          <div class="card-desc">${p.short_desc || ''}</div>
          <div class="card-price">
            <span class="price-now">${FMT(p.selling_price)}</span>
            ${discount > 0 ? `<span class="price-mrp">${FMT(p.mrp)}</span><span class="price-off">${discount}% OFF</span>` : ''}
          </div>
          <div class="card-actions">
            <button class="btn btn-primary" onclick="event.preventDefault();event.stopPropagation();addToCart('${p.slug}')" ${out ? 'disabled' : ''}>
              ${out ? 'Out of stock' : 'Add to Cart'}
            </button>
            <button class="btn btn-secondary" onclick="event.stopPropagation();" style="flex:0 0 auto">View →</button>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

updateCartCount();
loadProducts();

// ── Check auth state, update nav ──
fetch('/api/shop/me').then(r => r.json()).then(d => {
  if (d.logged_in) {
    document.getElementById('account-link').href = '/account.html';
    document.getElementById('account-label').textContent = d.customer.name ? d.customer.name.split(' ')[0] : 'Account';
  }
}).catch(()=>{});
</script>
</body>
</html>
