<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="o10ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Subtle dark plate (so it works on both light + dark backgrounds) -->
  <circle cx="32" cy="32" r="30" fill="#0a1628"/>
  <!-- Outer cyan ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#o10ring)" stroke-width="2.2"/>
  <!-- Inner mono-line K -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="24" y1="17" x2="24" y2="47"/>
    <line x1="24" y1="32" x2="42" y2="17"/>
    <line x1="24" y1="32" x2="42" y2="47"/>
  </g>
</svg>
