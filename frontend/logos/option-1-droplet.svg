<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0f2b4a"/>
      <stop offset="55%" stop-color="#091a2e"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>

    <linearGradient id="drop" x1="20" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#bae6fd"/>
      <stop offset="35%"  stop-color="#38bdf8"/>
      <stop offset="75%"  stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="k" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <radialGradient id="shine" cx="35%" cy="30%" r="40%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background plate -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Outer guardian rim (subtle cyan stroke) -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#1e4870" stroke-width="1"/>

  <!-- Purification ripple — protective ring -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="32" cy="34" r="26" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="0.6"/>

  <!-- Water droplet (refined teardrop with sharper tip) -->
  <path d="M32 9
           C32 9, 16 26, 16 38
           C16 47, 23 53.5, 32 53.5
           C41 53.5, 48 47, 48 38
           C48 26, 32 9, 32 9 Z"
        fill="url(#drop)"/>

  <!-- Droplet shine highlight -->
  <path d="M32 9
           C32 9, 16 26, 16 38
           C16 47, 23 53.5, 32 53.5
           C41 53.5, 48 47, 48 38
           C48 26, 32 9, 32 9 Z"
        fill="url(#shine)"/>

  <!-- Inner reflection arc — lower-left water surface -->
  <path d="M21 39 C21 44, 24.5 48, 29 48.5"
        stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Geometric "K" letterform centered inside droplet -->
  <g fill="url(#k)">
    <!-- Vertical stem: thick, slight rounded corners -->
    <path d="M25.2 25 L29.0 25 L29.0 47 L25.2 47 Z"/>
    <!-- Upper arm: clean diagonal -->
    <path d="M29.0 36 L29.0 32.5 L36.5 25 L41.4 25 L31.8 36 Z"/>
    <!-- Lower arm: mirror diagonal -->
    <path d="M29.0 36 L29.0 39.5 L36.5 47 L41.4 47 L31.8 36 Z"/>
  </g>
</svg>
