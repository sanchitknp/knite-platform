<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" fill="none">
  <defs>
    <linearGradient id="kn27" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0f2b4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Circular medallion -->
  <circle cx="110" cy="56" r="46" fill="url(#kn27)"/>
  <circle cx="110" cy="56" r="42" fill="none" stroke="#00b4d8" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- KN inside -->
