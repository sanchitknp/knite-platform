<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" fill="none">
  <!-- Speed lines on the left -->
  <line x1="14" y1="38" x2="32" y2="38" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>
  <line x1="6"  y1="56" x2="34" y2="56" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="74" x2="32" y2="74" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>

  <!-- KNITE italicized via skew -->
