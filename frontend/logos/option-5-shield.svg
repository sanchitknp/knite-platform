<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shGrad" x1="10" y1="4" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="shHi" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shield silhouette (modern, slightly tapered chevron base) -->
  <path d="M32 4
           L56 10
           L56 32
           C56 46, 46 56, 32 60
           C18 56, 8  46, 8  32
           L8  10 Z"
        fill="url(#shGrad)" stroke="#0c4a6e" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Top facet highlight -->
  <path d="M32 4 L56 10 L56 24 L8 24 L8 10 Z" fill="url(#shHi)"/>

  <!-- Inner stroke -->
  <path d="M32 8
           L52 13.5
           L52 32
           C52 44, 43.5 53, 32 56.5
           C20.5 53, 12 44, 12 32
           L12 13.5 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- White K monogram -->
  <g fill="#ffffff">
    <path d="M22 19 L27 19 L27 45 L22 45 Z"/>
    <path d="M27 32 L27 27.5 L37 19 L43 19 L31 32 Z"/>
    <path d="M27 32 L27 36.5 L37 45 L43 45 L31 32 Z"/>
  </g>
</svg>
