<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Checkout — Knite</title>
  <link rel="icon" type="image/x-icon" href="https://knite.in/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="https://knite.in/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="https://knite.in/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://knite.in/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://knite.in/icon-512.png">
  <link rel="icon" type="image/svg+xml" href="https://knite.in/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="https://knite.in/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0a1628;line-height:1.55}
    a{color:inherit;text-decoration:none}

    .nav{background:#0a1628;color:#fff;padding:14px 24px}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:3px}

    .wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
    h1{font-family:Poppins;font-size:30px;font-weight:800;margin-bottom:8px}
    .sub{color:#64748b;margin-bottom:24px;font-size:14px}

    .layout{display:grid;grid-template-columns:1fr 360px;gap:32px}
    @media(max-width:880px){.layout{grid-template-columns:1fr}}

    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin-bottom:20px}
    .card h2{font-family:Poppins;font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px}
    .card h2 .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#0a1628;color:#fff;border-radius:50%;font-size:12px;margin-right:8px}

    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:#475569;font-weight:600;margin-bottom:6px}
    .field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#0a1628}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#c07a4a;box-shadow:0 0 0 3px rgba(192,122,74,0.15)}
    .field-error{color:#dc2626;font-size:11px;margin-top:4px;display:none}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:640px){.row{grid-template-columns:1fr}}

    .payment-options{display:grid;gap:10px}
    .pay-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;transition:all .15s ease}
    .pay-opt.selected{border-color:#c07a4a;background:#f0f9ff}
    .pay-opt input{margin:0}
    .pay-opt-info{flex:1}
    .pay-opt-info strong{display:block;font-size:14px}
    .pay-opt-info span{font-size:12px;color:#64748b}
    .pay-opt-badge{font-size:10px;background:#dcfce7;color:#166534;padding:3px 8px;border-radius:99px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}

    .summary{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;align-self:start;position:sticky;top:20px}
    .summary h2{font-family:Poppins;font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
    .summary-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#475569}
    .summary-item .name{flex:1;padding-right:12px}
    .summary-item .qty{color:#94a3b8;font-size:11px}
    .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#475569;border-top:1px dashed #e2e8f0;margin-top:8px;padding-top:14px}
    .summary-row:first-of-type{margin-top:16px}
    .total{font-family:Poppins;font-weight:800;font-size:18px;color:#0a1628}

    .place-btn{width:100%;background:#0a1628;color:#fff;padding:14px;border-radius:10px;border:none;font-weight:700;font-size:15px;margin-top:18px;cursor:pointer}
    .place-btn:hover{background:#0369a1}
    .place-btn:disabled{opacity:0.6;cursor:not-allowed}
    .secure{font-size:11px;color:#94a3b8;text-align:center;margin-top:10px}

    .loading{padding:60px;text-align:center;color:#94a3b8}

    .err-bar{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
  </style>
  <script src="/nav.js?v=20260619" defer></script>
  <!-- Cashfree Checkout JS SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>

<div id="knite-nav"></div>

<div class="wrap">
  <h1>Checkout</h1>
  <p class="sub">Complete your order — no account required.</p>

  <div class="err-bar" id="err-bar"></div>

  <div id="guest-banner" style="display:none;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 16px;font-size:13px;color:#075985;margin-bottom:18px">
    💡 Already have a Knite account? <a href="/login.html?next=/checkout.html" style="color:#0369a1;font-weight:600">Sign in</a> to use saved addresses & track orders easily.
  </div>

  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');
const CART_KEY = 'knite_cart_v1';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch{return[]}}
let cartData = null;

let LOGGED_IN_CUSTOMER = null;
let SAVED_ADDRESSES = [];

async function init(){
  const cart = getCart();
  if(!cart.length){ window.location.href = '/cart.html'; return; }

  // Sign-in is mandatory to checkout
  try {
    const meR = await fetch('/api/shop/me', { credentials:'include' });
    const meData = await meR.json();
    if (!meData.logged_in) {
      window.location.href = '/login.html?next=' + encodeURIComponent('/checkout.html');
      return;
    }
    LOGGED_IN_CUSTOMER = meData.customer;
  } catch (e) {
    window.location.href = '/login.html?next=' + encodeURIComponent('/checkout.html');
    return;
  }

  // Cart validation + saved addresses
  try {
    const [vR, aR] = await Promise.all([
      fetch('/api/shop/cart/validate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ items: cart })
      }),
      fetch('/api/shop/my-addresses', { credentials:'include' }),
    ]);
    if(!vR.ok) throw new Error('HTTP '+vR.status);
    cartData = await vR.json();
    if (aR.ok) SAVED_ADDRESSES = await aR.json();
    if(!cartData.items.length){ window.location.href = '/cart.html'; return; }
    render();
    autoFill();
  } catch (err) {
    document.getElementById('root').innerHTML = '<div class="loading">Failed: '+err.message+'</div>';
  }
}

function autoFill() {
  const form = document.getElementById('checkout-form');
  if (!form) return;
  // Show "sign in" banner only for guests
  document.getElementById('guest-banner').style.display = LOGGED_IN_CUSTOMER ? 'none' : 'block';
  // Update the nav account chip
  if (LOGGED_IN_CUSTOMER) {
    const link = document.getElementById('account-link');
    const lbl  = document.getElementById('account-label');
    if (link && lbl) {
      link.href = '/account.html';
      lbl.textContent = LOGGED_IN_CUSTOMER.name ? LOGGED_IN_CUSTOMER.name.split(' ')[0] : 'Account';
    }
  }
  if (LOGGED_IN_CUSTOMER) {
    if (LOGGED_IN_CUSTOMER.name)  form.name.value  = LOGGED_IN_CUSTOMER.name;
    if (LOGGED_IN_CUSTOMER.email) form.email.value = LOGGED_IN_CUSTOMER.email;
    form.phone.value = LOGGED_IN_CUSTOMER.phone;
  }
  // If a default saved address exists, populate it
  const def = SAVED_ADDRESSES.find(a => a.is_default) || SAVED_ADDRESSES[0];
  if (def) {
    form.line1.value = def.line1 || '';
    form.line2.value = def.line2 || '';
    form.city.value  = def.city  || '';
    form.state.value = def.state || '';
    form.pincode.value = def.pincode || '';
  }
}

function render(){
  // Show name/email fields only if missing on the customer record; otherwise show a compact "ordering as" summary.
  const c = LOGGED_IN_CUSTOMER || {};
  const hasName  = !!(c.name  && c.name.trim());
  const hasEmail = !!(c.email && c.email.trim());
  const hasPhone = !!c.phone;
  const showContactFields = !(hasName && hasEmail && hasPhone);

  document.getElementById('root').innerHTML = `
    <div class="layout">
      <form id="checkout-form" onsubmit="placeOrder(event)">
        <div class="card">
          <h2><span class="num">1</span>Contact</h2>
          ${!showContactFields ? `
            <div id="contact-summary" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
              <div style="font-size:14px;line-height:1.7">
                <div style="font-weight:600;color:#0a1628">${escHtml(c.name)}</div>
                <div style="color:#64748b">+91 ${escHtml(c.phone)} · ${escHtml(c.email)}</div>
              </div>
              <a href="#" onclick="event.preventDefault();editContact()" style="color:#0369a1;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap">Edit ↻</a>
              <!-- hidden inputs so form.serialize works -->
              <input type="hidden" name="name"  value="${escAttr(c.name)}">
              <input type="hidden" name="phone" value="${escAttr(c.phone)}">
              <input type="hidden" name="email" value="${escAttr(c.email)}">
            </div>
            <div id="contact-fields" style="display:none">
              <div class="row">
                <div class="field"><label>Full Name *</label><input name="name_edit" placeholder="As on your address" value="${escAttr(c.name)}"></div>
                <div class="field"><label>Phone (WhatsApp)</label><input value="${escAttr(c.phone)}" disabled></div>
              </div>
              <div class="field"><label>Email *</label><input name="email_edit" type="email" value="${escAttr(c.email)}"></div>
            </div>
          ` : `
            <div class="row">
              <div class="field"><label>Full Name *</label><input name="name" required placeholder="As on your address" value="${escAttr(c.name || '')}"></div>
              <div class="field"><label>Phone (WhatsApp) *</label><input name="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile" value="${escAttr(c.phone || '')}" ${hasPhone ? 'readonly' : ''}></div>
            </div>
            <div class="field"><label>Email *</label><input name="email" type="email" required placeholder="for order updates" value="${escAttr(c.email || '')}"></div>
            <p style="font-size:12px;color:#94a3b8;margin-top:6px">We'll save these for your next order so you don't have to re-enter.</p>
          `}
        </div>

        <div class="card">
          <h2><span class="num">2</span>Shipping Address</h2>
          <div class="field"><label>Address Line 1 *</label><input name="line1" required placeholder="House / flat / building name"></div>
          <div class="field"><label>Address Line 2</label><input name="line2" placeholder="Street, area, landmark"></div>
          <div class="row">
            <div class="field"><label>City *</label><input name="city" required></div>
            <div class="field"><label>State *</label>
              <select name="state" required>
                <option value="">Select state…</option>
                ${['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Delhi','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli','Daman and Diu','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry']
                  .map(s => `<option>${s}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="row">
            <div class="field"><label>Pincode *</label><input name="pincode" required pattern="[0-9]{6}" maxlength="6" placeholder="6 digits"></div>
            <div class="field"><label>Country</label><input value="India" disabled></div>
          </div>
        </div>

        <div class="card">
          <h2><span class="num">3</span>Payment Method</h2>
          <div class="payment-options">
            <label class="pay-opt selected">
              <input type="radio" name="payment_method" value="online" checked>
              <div class="pay-opt-info"><strong>Pay Online (UPI / Card / Netbanking / Wallet)</strong><span>Secure payment via Cashfree — encrypted &amp; instant</span></div>
              <span class="pay-opt-badge">Secure</span>
            </label>
          </div>
        </div>

        <div class="card">
          <h2><span class="num">4</span>Notes (Optional)</h2>
          <div class="field">
            <textarea name="notes" rows="2" placeholder="Anything we should know about delivery or installation?"></textarea>
          </div>
        </div>
      </form>

      <div class="summary">
        <h2>Order Summary</h2>
        ${cartData.items.map(i => `
          <div class="summary-item">
            <div class="name">${i.name} <span class="qty">× ${i.quantity}</span></div>
            <div>${FMT(i.line_total)}</div>
          </div>`).join('')}
        <div class="summary-row"><span>Subtotal</span><span>${FMT(cartData.subtotal)}</span></div>
        <div class="summary-row"><span>GST</span><span>${FMT(cartData.tax)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>${cartData.shipping > 0 ? FMT(cartData.shipping) : 'FREE'}</span></div>
        <div class="summary-row total"><span>Total</span><span>${FMT(cartData.total)}</span></div>
        <button class="place-btn" id="placeBtn" onclick="document.getElementById('checkout-form').requestSubmit()">Place Order →</button>
        <div class="secure">🔒 Your details are encrypted · No card data stored</div>
      </div>
    </div>
  `;
}

function selectPay(input){
  document.querySelectorAll('.pay-opt').forEach(el => el.classList.remove('selected'));
  input.closest('.pay-opt').classList.add('selected');
}

// ── helpers + edit toggle ──
function escHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return escHtml(s)}
function editContact(){
  document.getElementById('contact-summary').style.display='none';
  document.getElementById('contact-fields').style.display='';
}

async function placeOrder(e){
  e.preventDefault();
  const form = document.getElementById('checkout-form');
  const data = new FormData(form);
  const btn = document.getElementById('placeBtn');
  const err = document.getElementById('err-bar');
  err.style.display = 'none';

  // If user opened the Edit panel, prefer those values
  const editedName  = data.get('name_edit');
  const editedEmail = data.get('email_edit');
  const finalName  = (editedName && String(editedName).trim()) || data.get('name');
  const finalEmail = (editedEmail && String(editedEmail).trim()) || data.get('email');
  const finalPhone = data.get('phone');

  // If logged-in customer's name/email differ from what they just typed, persist them
  if (LOGGED_IN_CUSTOMER) {
    const patches = {};
    if (finalName  && finalName  !== LOGGED_IN_CUSTOMER.name)  patches.name  = finalName;
    if (finalEmail && finalEmail !== LOGGED_IN_CUSTOMER.email) patches.email = finalEmail;
    if (Object.keys(patches).length) {
      fetch('/api/shop/me', { method:'PATCH', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patches) }).catch(()=>{});
    }
  }

  const payload = {
    items: getCart(),
    customer: {
      name: finalName,
      email: finalEmail,
      phone: finalPhone,
    },
    shipping_address: {
      line1: data.get('line1'),
      line2: data.get('line2') || '',
      city: data.get('city'),
      state: data.get('state'),
      pincode: data.get('pincode'),
      country: 'IN',
    },
    payment_method: data.get('payment_method') || 'cod',
    notes: data.get('notes') || '',
  };

  btn.disabled = true;
  btn.textContent = 'Placing order…';
  try {
    const r = await fetch('/api/shop/orders', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if (r.status === 401) {
      window.location.href = '/login.html?next=' + encodeURIComponent('/checkout.html');
      return;
    }
    const body = await r.json();
    if(!r.ok || !body.ok) throw new Error(body.error || 'Order failed');

    // Clear cart (we have the order in DB now)
    localStorage.removeItem(CART_KEY);
    if (window.kniteUpdateCart) window.kniteUpdateCart();

    // ── ONLINE PAYMENT branch ──
    if (payload.payment_method === 'online') {
      btn.textContent = 'Redirecting to payment…';
      try {
        const cR = await fetch('/api/shop/payment/create-order', {
          method:'POST', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ order_id: body.order_id })
        });
        const cBody = await cR.json();
        if (!cR.ok || !cBody.payment_session_id) throw new Error(cBody.error || 'Could not start payment');

        // Open Cashfree hosted checkout
        if (typeof Cashfree !== 'function') throw new Error('Payment SDK failed to load');
        const cashfree = await Cashfree({ mode: cBody.mode === 'production' ? 'production' : 'sandbox' });
        await cashfree.checkout({
          paymentSessionId: cBody.payment_session_id,
          redirectTarget: '_self',  // full-page redirect (mobile-friendly + iOS-safe)
        });
        // On _self, Cashfree replaces the page; this code path won't execute further.
        return;
      } catch (e) {
        err.textContent = '⚠️ Payment could not be initiated: ' + e.message + ' — your order is saved, you can pay later.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Retry Payment';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }

    // ── COD branch ──
    window.location.href = `/order.html?id=${body.order_id}&phone=${payload.customer.phone.replace(/[^0-9]/g,'').slice(-10)}&new=1`;
  } catch (e) {
    err.textContent = '⚠️ ' + e.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Place Order →';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

init();
</script>
</body>
</html>
