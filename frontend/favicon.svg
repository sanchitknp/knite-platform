<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="knBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0f2b4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Circular medallion -->
  <circle cx="32" cy="32" r="32" fill="url(#knBg)"/>
  <!-- Inner cyan ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00b4d8" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- KN monogram -->
  <text x="32" y="42" text-anchor="middle"
        font-family="Poppins, Inter, Helvetica, Arial, system-ui, sans-serif"
        font-weight="800" font-size="26" letter-spacing="-2"
        fill="#ffffff">KN</text>
</svg>
