<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="11" y1="6" x2="25" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="18" cy="18" r="18" fill="url(#bgGrad)"/>
  <circle cx="18" cy="18" r="17.4" fill="none" stroke="#1a3a5c" stroke-width="0.6"/>

  <!-- Soft inner glow -->
  <circle cx="18" cy="20" r="11" fill="#00b4d8" fill-opacity="0.12"/>

  <!-- Water droplet -->
  <path d="M18 5.5
           C18 5.5, 9 16, 9 21.8
           C9 26.5, 13 30, 18 30
           C23 30, 27 26.5, 27 21.8
           C27 16, 18 5.5, 18 5.5 Z"
        fill="url(#dropGrad)"/>

  <!-- Upper highlight (suggests purity) -->
  <ellipse cx="14.3" cy="13" rx="1.8" ry="3.6" fill="white" fill-opacity="0.4" transform="rotate(-20 14.3 13)"/>

  <!-- Lower inner reflection curve -->
  <path d="M12.8 22 C12.8 24.6, 14.6 26.4, 17 26.8"
        stroke="white" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round" fill="none"/>

  <!-- Subtle "K" mark inside droplet (negative space, low opacity) -->
  <g stroke="white" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="15.8" y1="16" x2="15.8" y2="24"/>
    <line x1="15.8" y1="20" x2="20.2" y2="16"/>
    <line x1="15.8" y1="20" x2="20.2" y2="24"/>
  </g>
</svg>
