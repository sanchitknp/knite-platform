<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Knite</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0a1628;line-height:1.55}
    a{color:inherit;text-decoration:none}

    .nav{background:#0a1628;color:#fff;padding:14px 24px}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:3px}
    .nav-links{display:flex;gap:20px;font-size:14px;align-items:center}

    .wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}

    .hero{background:linear-gradient(135deg,#0a1628,#0369a1);color:#fff;padding:30px;border-radius:18px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .hero-info h1{font-family:Poppins;font-size:24px;margin-bottom:4px}
    .hero-info p{font-size:13px;opacity:0.85}
    .hero-stats{display:flex;gap:24px}
    .stat{text-align:right}
    .stat .v{font-family:Poppins;font-size:22px;font-weight:800}
    .stat .l{font-size:11px;opacity:0.75;text-transform:uppercase;letter-spacing:1px}

    .tabs{display:flex;gap:8px;background:#fff;padding:6px;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:20px;overflow-x:auto}
    .tab{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#64748b;white-space:nowrap}
    .tab.active{background:#0a1628;color:#fff}
    .tab:hover:not(.active){background:#f1f5f9;color:#0a1628}

    .panel{display:none}
    .panel.active{display:block}

    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;margin-bottom:14px}
    .card h3{font-family:Poppins;font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#475569;margin-bottom:14px}

    .order-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:12px;transition:all .2s ease}
    .order-card:hover{box-shadow:0 8px 24px rgba(10,22,40,0.08);border-color:#00b4d8}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .order-num{font-family:Poppins;font-weight:700;font-size:15px}
    .order-date{font-size:12px;color:#94a3b8;margin-top:2px}
    .status-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:0.5px;text-transform:uppercase}
    .status-pending   {background:#fef3c7;color:#92400e}
    .status-confirmed {background:#dbeafe;color:#1e40af}
    .status-processing{background:#ede9fe;color:#5b21b6}
    .status-shipped   {background:#cffafe;color:#0e7490}
    .status-delivered {background:#dcfce7;color:#166534}
    .status-cancelled {background:#fee2e2;color:#991b1b}

    .order-items{font-size:13px;color:#64748b;margin-bottom:10px}
    .order-items li{padding:2px 0;list-style:none}
    .order-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px solid #f1f5f9}
    .order-total{font-family:Poppins;font-weight:800;font-size:17px;color:#0a1628}
    .order-actions a{font-size:12px;color:#0369a1;font-weight:600;margin-left:14px;cursor:pointer}
    .order-actions a:hover{text-decoration:underline}

    .empty{padding:60px 24px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b}
    .empty h4{font-family:Poppins;font-size:16px;color:#0a1628;margin-bottom:6px}
    .empty p{font-size:13px;margin-bottom:14px}
    .btn-primary{background:#0a1628;color:#fff;padding:11px 22px;border-radius:8px;display:inline-block;font-size:13px;font-weight:600}

    .field{margin-bottom:12px}
    .field label{display:block;font-size:12px;color:#475569;font-weight:600;margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit}
    .field input:focus,.field select:focus{outline:none;border-color:#00b4d8;box-shadow:0 0 0 3px rgba(0,180,216,0.15)}
    .field input:disabled{background:#f8fafc;color:#94a3b8}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:640px){.row2{grid-template-columns:1fr}}

    .btn{padding:11px 20px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
    .btn-dark{background:#0a1628;color:#fff}
    .btn-dark:hover{background:#0369a1}
    .btn-ghost{background:#f1f5f9;color:#0a1628;border:1px solid #e2e8f0}
    .btn-ghost:hover{background:#e2e8f0}
    .btn-danger{background:transparent;color:#dc2626;font-size:12px;padding:0}
    .btn-danger:hover{text-decoration:underline}

    .addr-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:18px;display:flex;justify-content:space-between;gap:14px;margin-bottom:10px}
    .addr-card.default{border-color:#00b4d8;background:#f0f9ff}
    .addr-card .lbl{display:inline-block;background:#0a1628;color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
    .addr-card.default .lbl{background:#00b4d8}
    .addr-card .text{font-size:13px;color:#475569;line-height:1.5}
    .addr-card .text strong{display:block;color:#0a1628;margin-bottom:2px}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0a1628;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);z-index:200}
    .toast.show{transform:translateX(-50%) translateY(0)}

    .loading{padding:40px;text-align:center;color:#94a3b8;font-size:13px}
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a href="/" class="nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="b1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0f2b4a"/><stop offset="100%" stop-color="#020617"/></linearGradient></defs>
        <circle cx="32" cy="32" r="32" fill="url(#b1)"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#00b4d8" stroke-width="0.9" stroke-opacity="0.55"/>
        <text x="32" y="42" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="800" font-size="26" letter-spacing="-2" fill="#fff">KN</text>
      </svg>
      KNITE<span style="color:#00b4d8">.</span>
    </a>
    <div class="nav-links">
      <a href="/shop.html">Shop</a>
      <a href="/cart.html">Cart</a>
      <a onclick="logout()" style="cursor:pointer">Logout</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <div id="root"><div class="loading">Loading…</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');
let CUSTOMER = null;

(async function init() {
  try {
    const r = await fetch('/api/shop/me');
    const data = await r.json();
    if (!data.logged_in) { window.location.replace('/login.html?next=/account.html'); return; }
    CUSTOMER = data.customer;
    renderShell();
    loadOrders();
  } catch (err) {
    document.getElementById('root').innerHTML = '<div class="loading">Could not load profile</div>';
  }
})();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._t); window._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderShell() {
  const c = CUSTOMER;
  document.getElementById('root').innerHTML = `
    <div class="hero">
      <div class="hero-info">
        <h1>Hi ${c.name || 'there'} 👋</h1>
        <p>+91 ${c.phone} ${c.email ? '· ' + c.email : ''}</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><div class="v">${c.total_orders || 0}</div><div class="l">Orders</div></div>
        <div class="stat"><div class="v">${FMT(c.total_spent || 0)}</div><div class="l">Spent</div></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="orders"    onclick="switchTab('orders')">📦 My Orders</button>
      <button class="tab"        data-tab="addresses" onclick="switchTab('addresses')">📍 Addresses</button>
      <button class="tab"        data-tab="profile"   onclick="switchTab('profile')">👤 Profile</button>
    </div>

    <div class="panel active" id="panel-orders">    <div id="orders-list" class="loading">Loading orders…</div></div>
    <div class="panel"        id="panel-addresses"><div id="addr-list"   class="loading">Loading addresses…</div></div>
    <div class="panel"        id="panel-profile">  <div id="profile"     class="loading">Loading profile…</div></div>
  `;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'addresses' && !window._addrLoaded) { loadAddresses(); window._addrLoaded = true; }
  if (tab === 'profile' && !window._profLoaded) { loadProfile(); window._profLoaded = true; }
}

// ── Orders ──
async function loadOrders() {
  try {
    const r = await fetch('/api/shop/my-orders', { credentials: 'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const orders = await r.json();
    const list = document.getElementById('orders-list');
    if (!orders.length) {
      list.innerHTML = `
        <div class="empty">
          <h4>No orders yet</h4>
          <p>Browse our purifiers and place your first order.</p>
          <a class="btn-primary" href="/shop.html">Shop Now →</a>
        </div>`;
      list.classList.remove('loading');
      return;
    }
    list.innerHTML = orders.map(o => {
      const dt = new Date(o.created_at).toLocaleDateString('en-IN', { dateStyle: 'medium' });
      const itemsTxt = (o.items || []).map(i => `<li>• ${i.name} <span style="color:#94a3b8">× ${i.qty}</span></li>`).join('');
      return `
        <div class="order-card">
          <div class="order-top">
            <div>
              <div class="order-num">${o.order_number}</div>
              <div class="order-date">${dt}</div>
            </div>
            <span class="status-badge status-${o.status}">${o.status}</span>
          </div>
          <ul class="order-items">${itemsTxt}</ul>
          ${o.tracking_number ? `<div style="background:#f0f9ff;border-radius:8px;padding:8px 12px;font-size:12px;color:#0369a1;margin-bottom:10px">📦 Tracking: <strong>${o.tracking_number}</strong> · ${o.shipping_carrier || 'Courier'}</div>` : ''}
          <div class="order-bottom">
            <div class="order-total">${FMT(o.total_amount)}</div>
            <div class="order-actions">
              <a onclick="window.location.href='/order.html?id=${o.id}&phone=${CUSTOMER.phone}'">View Details →</a>
            </div>
          </div>
        </div>`;
    }).join('');
    list.classList.remove('loading');
  } catch (err) {
    document.getElementById('orders-list').innerHTML = '<div class="empty">Could not load orders</div>';
  }
}

// ── Addresses ──
async function loadAddresses() {
  try {
    const r = await fetch('/api/shop/my-addresses', { credentials: 'include' });
    const addrs = await r.json();
    const list = document.getElementById('addr-list');
    let html = '';
    if (!addrs.length) {
      html += `<div class="empty"><h4>No saved addresses</h4><p>Save addresses for faster checkout.</p></div>`;
    } else {
      html += addrs.map(a => `
        <div class="addr-card ${a.is_default ? 'default' : ''}">
          <div>
            <div class="lbl">${a.label}${a.is_default ? ' · Default' : ''}</div>
            <div class="text">
              <strong>${a.full_name}</strong>
              ${a.line1}${a.line2 ? ', ' + a.line2 : ''}<br>
              ${a.city}, ${a.state} ${a.pincode}<br>
              +91 ${a.phone}
            </div>
          </div>
          <div><button class="btn-danger" onclick="deleteAddr(${a.id})">Delete</button></div>
        </div>`).join('');
    }
    html += `
      <div class="card" style="margin-top:18px">
        <h3>+ Add a new address</h3>
        <form onsubmit="addAddr(event)" id="addr-form">
          <div class="row2">
            <div class="field"><label>Label</label><input name="label" value="Home" required></div>
            <div class="field"><label>Phone (10 digits)</label><input name="phone" required pattern="[0-9]{10}" maxlength="10" value="${CUSTOMER.phone}"></div>
          </div>
          <div class="field"><label>Full Name</label><input name="full_name" required value="${CUSTOMER.name || ''}"></div>
          <div class="field"><label>Address Line 1</label><input name="line1" required></div>
          <div class="field"><label>Address Line 2</label><input name="line2"></div>
          <div class="row2">
            <div class="field"><label>City</label><input name="city" required></div>
            <div class="field"><label>State</label>
              <select name="state" required>
                <option value="">Select…</option>
                ${['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Delhi','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Chandigarh','Jammu and Kashmir','Ladakh','Puducherry'].map(s => `<option>${s}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label>Pincode</label><input name="pincode" required pattern="[0-9]{6}" maxlength="6"></div>
            <div class="field" style="display:flex;align-items:flex-end"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" name="is_default"> Set as default</label></div>
          </div>
          <button type="submit" class="btn btn-dark">Save Address</button>
        </form>
      </div>`;
    list.innerHTML = html;
    list.classList.remove('loading');
  } catch (err) {
    document.getElementById('addr-list').innerHTML = '<div class="empty">Could not load addresses</div>';
  }
}

async function addAddr(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = Object.fromEntries(f.entries());
  body.is_default = f.get('is_default') === 'on';
  try {
    const r = await fetch('/api/shop/my-addresses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('Failed');
    showToast('Address saved');
    loadAddresses();
  } catch (err) {
    showToast('Failed to save');
  }
}

async function deleteAddr(id) {
  if (!confirm('Delete this address?')) return;
  await fetch('/api/shop/my-addresses/' + id, { method: 'DELETE', credentials: 'include' });
  showToast('Address deleted');
  loadAddresses();
}

// ── Profile ──
function loadProfile() {
  document.getElementById('profile').innerHTML = `
    <div class="card">
      <h3>Profile Information</h3>
      <form onsubmit="updateProfile(event)">
        <div class="field"><label>Name</label><input name="name" required value="${CUSTOMER.name || ''}"></div>
        <div class="field"><label>Email</label><input name="email" type="email" required value="${CUSTOMER.email || ''}"></div>
        <div class="field"><label>Phone</label><input value="+91 ${CUSTOMER.phone}" disabled></div>
        <button type="submit" class="btn btn-dark">Save Changes</button>
      </form>
    </div>
    <div class="card">
      <h3>Member Since</h3>
      <p style="font-size:14px;color:#475569">${new Date(CUSTOMER.created_at).toLocaleDateString('en-IN', { dateStyle: 'long' })}</p>
    </div>
    <div class="card" style="background:#fef2f2;border-color:#fecaca">
      <h3 style="color:#991b1b">Sign Out</h3>
      <p style="font-size:13px;color:#7f1d1d;margin-bottom:12px">Sign out of your Knite account on this device.</p>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  `;
  document.getElementById('profile').classList.remove('loading');
}

async function updateProfile(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await fetch('/api/shop/me', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name: f.get('name'), email: f.get('email') })
    });
    CUSTOMER.name = f.get('name'); CUSTOMER.email = f.get('email');
    showToast('Profile updated');
  } catch { showToast('Update failed'); }
}

async function logout() {
  await fetch('/api/shop/auth/logout', { method: 'POST', credentials: 'include' });
  window.location.replace('/');
}
</script>
</body>
</html>
