<body>

<div id="knite-nav"></div>

<div class="crumbs" id="crumbs">
  <a href="/">Home</a> · <a href="/#products">Shop</a> · <span id="crumb-name">Product</span>
</div>

<main id="pdp-root"><div class="loading">Loading product…</div></main>

<div class="toast" id="toast"></div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');
const CART_KEY = 'knite_cart_v1';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch{return[]}}
function setCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartCount()}
function updateCartCount(){var _e=document.getElementById('cart-count');if(_e)_e.textContent=getCart().reduce((s,i)=>s+(i.quantity||0),0);if(window.kniteUpdateCart)window.kniteUpdateCart();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)}

const PRODUCT_SVG = `
<svg viewBox="0 0 140 180" fill="none">
  <rect x="30" y="20" width="80" height="150" rx="10" fill="#fff" stroke="#0a1628" stroke-width="2.5"/>
  <rect x="45" y="35" width="50" height="65" rx="8" fill="url(#water)"/>
  <text x="70" y="70" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="11" letter-spacing="2">KNITE</text>
  <circle cx="70" cy="118" r="14" fill="#0a1628"/>
  <text x="70" y="123" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="11">KN</text>
  <rect x="55" y="142" width="30" height="20" rx="3" fill="#e2e8f0"/>
  <defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="65" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#0369a1"/>
  </linearGradient></defs>
</svg>`;

const HERO_SLUGS = ['knite-core','knite-flux','knite-flux-white','knite-prime-white','knite-prime-black','knite-shield-copper','knite-shield-silver','knite-edge-black','knite-edge-silver'];

// Per-product image galleries (Amazon-style). Add more slugs here as image sets arrive.
const GV = '20260625l';
const GALLERY = {
  'knite-flux-white': [1,2,3,4,5,6,7,8].map(n => `/products/gallery/knite-flux-white/${n}.jpg?v=${GV}`),
  'knite-flux':       [1,2,3,4,5,6,7,8].map(n => `/products/gallery/knite-flux/${n}.jpg?v=${GV}`),
  'knite-core':       [1,2,3,4,5,6,7,8].map(n => `/products/gallery/knite-core/${n}.jpg?v=${GV}`)
};
function setMainImg(i){
  if(!window.__gal) return;
  window.__galIdx = i;
  const im=document.getElementById('pdpMainImg'); if(im) im.src=window.__gal[i];
  document.querySelectorAll('.pdp-thumb').forEach((t,j)=>{ const a=(j===i); t.classList.toggle('active', a); if(a&&t.scrollIntoView) t.scrollIntoView({block:'nearest',inline:'nearest'}); });
}
function galNav(dir){ if(!window.__gal||window.__gal.length<2) return; const n=window.__gal.length; setMainImg(((window.__galIdx||0)+dir+n)%n); }
let __galTouchX=null;
function galTouchStart(e){ __galTouchX = e.changedTouches[0].clientX; }
function galTouchEnd(e){ if(__galTouchX==null) return; const dx=e.changedTouches[0].clientX-__galTouchX; __galTouchX=null; if(Math.abs(dx)>40) galNav(dx<0?1:-1); }

async function loadProduct() {
  const slug = new URLSearchParams(window.location.search).get('slug');
  const __OLD2NEW={'knite-onix':'knite-core','knite-lexter':'knite-flux','knite-era-core':'knite-prime-white','knite-era-elite':'knite-prime-black','knite-era-silk':'knite-prime-white','knite-prime':'knite-prime-white','knite-prime-elite':'knite-prime-black','knite-prime-silk':'knite-prime-white','knite-canix-elite':'knite-shield-copper','knite-canix-metallic':'knite-shield-silver','knite-iris-elite':'knite-edge-black','knite-iris-metallic':'knite-edge-silver'}; if(__OLD2NEW[slug]){window.location.replace('/product.html?slug='+__OLD2NEW[slug]);return;}
  if (!slug) { document.getElementById('pdp-root').innerHTML = '<div class="loading">No product selected</div>'; return; }
  try {
    const r = await fetch('/api/shop/products/' + slug);
    if (!r.ok) throw new Error('Product not found');
    const p = await r.json();
    render(p);
  } catch (err) {
    document.getElementById('pdp-root').innerHTML = '<div class="loading">' + err.message + '</div>';
  }
}

function render(p) {
  document.title = p.name + ' — Knite';
  document.getElementById('crumb-name').textContent = p.name;

  // ── SEO: update meta, canonical, OG, JSON-LD dynamically ──
  const url = 'https://knite.in/product.html?slug=' + encodeURIComponent(p.slug);
  const desc = (p.short_desc || p.long_desc || '').slice(0, 160);
  const setMeta = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
  setMeta('meta-desc', 'content', desc);
  setMeta('canonical-link', 'href', url);
  setMeta('og-url', 'content', url);
  setMeta('og-title', 'content', p.name + ' — Knite');
  setMeta('og-desc', 'content', desc);

  // Inject Product + Breadcrumb JSON-LD
  const productLd = {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": p.name,
    "description": p.long_desc || p.short_desc || '',
    "sku": p.sku || ('KNITE-' + (p.slug || '').toUpperCase()),
    "brand": { "@type": "Brand", "name": "Knite" },
    "image": HERO_SLUGS.includes(p.slug) ? ("https://knite.in/products/" + p.slug + ".jpg") : "https://knite.in/favicon.svg",
    "url": url,
    "offers": {
      "@type": "Offer",
      "url": url,
      "priceCurrency": "INR",
      "price": String(p.selling_price),
      "availability": p.stock > 0 ? "https://schema.org/InStock" : "https://schema.org/OutOfStock",
      "seller": { "@type": "Organization", "name": "Knite" }
    }
  };
  if (p.review_count > 0 && p.rating_avg > 0) {
    productLd.aggregateRating = {
      "@type": "AggregateRating",
      "ratingValue": Number(p.rating_avg).toFixed(1),
      "reviewCount": p.review_count,
      "bestRating": "5",
      "worstRating": "1"
    };
  }
  const crumbLd = {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://knite.in/" },
      { "@type": "ListItem", "position": 2, "name": "Shop", "item": "https://knite.in/#products" },
      { "@type": "ListItem", "position": 3, "name": p.name, "item": url }
    ]
  };
  const s1 = document.createElement('script'); s1.type = 'application/ld+json'; s1.textContent = JSON.stringify(productLd); document.head.appendChild(s1);
  const s2 = document.createElement('script'); s2.type = 'application/ld+json'; s2.textContent = JSON.stringify(crumbLd); document.head.appendChild(s2);

  const discount = p.mrp > p.selling_price ? Math.round(((p.mrp - p.selling_price)/p.mrp)*100) : 0;
  const out = p.stock <= 0;
  const features = Array.isArray(p.features) ? p.features : [];
  const specs = p.specs && typeof p.specs === 'object' ? p.specs : {};
  const wm = Number(p.warranty_months) || 12;
  const warrYears = wm >= 24 ? '2-Year' : (wm >= 12 ? '1-Year' : wm + '-Month');
  const warrPerk = wm >= 24
    ? 'Free filters: 3 spun + 1 sediment + 1 carbon + 1 alkaline + on-site service'
    : 'Includes 1 free spun-filter replacement';

  document.getElementById('pdp-root').innerHTML = `
    <section class="pdp">
      ${(() => {
        const imgs = GALLERY[p.slug] || (HERO_SLUGS.includes(p.slug) ? ['/products/'+p.slug+'.jpg?v=20260626'] : []);
        window.__gal = imgs; window.__galIdx = 0;
        if (!imgs.length) return `<div class="pdp-img">${PRODUCT_SVG}</div>`;
        const thumbs = imgs.length > 1 ? `<div class="pdp-thumbs">${imgs.map((s,i)=>`<button type="button" class="pdp-thumb${i===0?' active':''}" onmouseenter="setMainImg(${i})" onfocus="setMainImg(${i})" onclick="setMainImg(${i})" aria-label="View ${i+1}"><img src="${s}" alt="${p.name} view ${i+1}" loading="lazy"></button>`).join('')}</div>` : '';
        const arrows = imgs.length > 1 ? `<button type="button" class="gal-arrow gal-prev" onclick="galNav(-1)" aria-label="Previous image">&#8249;</button><button type="button" class="gal-arrow gal-next" onclick="galNav(1)" aria-label="Next image">&#8250;</button>` : '';
        return `<div class="pdp-gallery${imgs.length>1?'':' single'}"><div class="pdp-main" ontouchstart="galTouchStart(event)" ontouchend="galTouchEnd(event)"><img id="pdpMainImg" src="${imgs[0]}" alt="${p.name}">${arrows}</div>${thumbs}</div>`;
      })()}
      <div class="pdp-info">
        <div class="pdp-brand">${p.brand || 'Knite'}</div>
        <h1>${p.name}</h1>
        ${(p.review_count > 0) ? `
          <div class="rating-inline">
            ${starsHtml(p.rating_avg)}
            <span class="num">${Number(p.rating_avg).toFixed(1)}</span>
            <span>·</span>
            <a href="#reviews">${p.review_count} verified review${p.review_count === 1 ? '' : 's'}</a>
          </div>` : ''}
        <p class="pdp-desc">${p.long_desc || p.short_desc || ''}</p>

        <div class="pdp-price">
          <span class="price-now">${FMT(p.selling_price)}</span>
          ${discount > 0 ? `<span class="price-mrp">${FMT(p.mrp)}</span><span class="price-off">${discount}% OFF</span>` : ''}
        </div>
        <div class="price-incl">Inclusive of all taxes · Free installation · ${warrYears.toLowerCase()} warranty</div>

        <div class="warranty-highlight">
          <span class="wh-ic">🛡️</span>
          <div class="wh-text">
            <strong>${warrYears} Comprehensive Warranty</strong>
            <span>${warrPerk}</span>
          </div>
        </div>

        <div class="pdp-actions">
          <div class="qty-box">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input type="number" id="qty" class="qty-input" value="0" min="0" max="5" readonly>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn btn-cta" id="buyBtn" onclick="buyNow()" ${out ? 'disabled' : 'disabled'}>${out ? 'Out of stock' : 'Buy Now →'}</button>
        </div>

        ${features.length ? `
          <div class="pdp-features">
            <h3>Key Features</h3>
            <ul>${features.map(f => `<li>${f}</li>`).join('')}</ul>
          </div>
        ` : ''}

        <div class="trust">
          <div class="trust-item"><span class="ic">🚚</span>Free Delivery</div>
          <div class="trust-item"><span class="ic">🔧</span>Free Installation</div>
          <div class="trust-item"><span class="ic">🛡️</span>${warrYears} Warranty</div>
        </div>
      </div>
    </section>

    ${(() => {
      const SPEC_LABELS = [
        ['purification_technology','Purification Technology'],
        ['total_stages','Total Stages'],
        ['purification_chain','Purification Stages'],
        ['ro_membrane','RO Membrane'],
        ['tds_rejection','TDS Rejection'],
        ['max_input_tds','Max Input TDS'],
        ['uv_sterilisation','UV Sterilisation'],
        ['ultrafiltration','Ultrafiltration (UF)'],
        ['alkaline_mineraliser','Alkaline / Mineraliser'],
        ['tds_controller','TDS Controller'],
        ['auto_flush','Auto-Flush'],
        ['antiscalant_doser','Antiscalant Doser'],
        ['purification_capacity','Purification Capacity'],
        ['storage_tank','Storage Tank'],
        ['tank_material','Tank Material'],
        ['booster_pump','Booster Pump'],
        ['suitable_water_source','Suitable Water Source'],
        ['feed_water_pressure','Feed Water Pressure'],
        ['feed_water_temperature','Feed Water Temperature'],
        ['operating_voltage','Operating Voltage'],
        ['power_consumption','Power Consumption'],
        ['dimensions','Dimensions (W × D × H)'],
        ['net_weight','Net Weight'],
        ['body_material','Body / Cabinet'],
        ['finish_colour','Finish / Colour'],
        ['installation','Installation'],
        ['filter_life','Filter Life'],
        ['in_the_box','In the Box'],
        ['warranty','Warranty'],
        ['warranty_filters','Free Filters (Warranty)'],
        ['country_of_origin','Country of Origin'],
        ['marketed_by','Marketed By'],
      ];
      const known = new Set(SPEC_LABELS.map(x => x[0]));
      const rows = [];
      for (const [k,label] of SPEC_LABELS)
        if (specs[k] !== undefined && specs[k] !== null && specs[k] !== '') rows.push([label, specs[k]]);
      for (const [k,v] of Object.entries(specs))
        if (!known.has(k) && v !== null && v !== '') rows.push([k.replace(/_/g,' '), v]);
      if (!rows.length) return '';
      return `<section class="specs"><h2>Specifications</h2><div class="specs-grid">${rows.map(([label,v]) =>
        `<div class="spec-row"><div class="spec-key">${label}</div><div class="spec-val">${v}</div></div>`).join('')}</div></section>`;
    })()}

    <section class="reviews" id="reviews">
      <h2>Customer Reviews</h2>
      <div id="reviews-body"><div class="loading">Loading reviews…</div></div>
    </section>
  `;

  window._currentSlug = p.slug;
  window._currentMax = Math.min(5, Math.max(1, p.stock));

  // Load reviews + eligibility in parallel after PDP renders
  loadReviews(p.slug);
}

// ── Star helpers ──
function starSvg(filled) {
  return `<svg viewBox="0 0 24 24"><path class="${filled ? 'star-fill' : 'star-empty'}" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77 5.82 21l1.18-6.88-5-4.87 6.91-1.01z"/></svg>`;
}
function starsHtml(avg) {
  let v = Number(avg) || 0;
  let s = '<span class="stars">';
  for (let i = 1; i <= 5; i++) s += starSvg(i <= Math.round(v));
  s += '</span>';
  return s;
}

// ── Reviews load + render ──
async function loadReviews(slug) {
  try {
    const [revR, eligR] = await Promise.all([
      fetch('/api/shop/products/' + encodeURIComponent(slug) + '/reviews').then(r => r.json()),
      fetch('/api/shop/products/' + encodeURIComponent(slug) + '/review-eligibility').then(r => r.json()).catch(() => ({ canReview: false, reason: 'not-logged-in' })),
    ]);
    renderReviews(slug, revR, eligR);
  } catch (e) {
    document.getElementById('reviews-body').innerHTML = '<p style="color:#94a3b8">Could not load reviews.</p>';
  }
}

function renderReviews(slug, data, elig) {
  const { reviews = [], aggregate = {} } = data || {};
  const total = aggregate.count || 0;
  const avg   = Number(aggregate.avg || 0);
  const breakdown = [5,4,3,2,1].map(n => ({ n, c: aggregate['r' + n] || 0 }));

  const formHtml = renderReviewForm(slug, elig);

  if (!total) {
    document.getElementById('reviews-body').innerHTML = `
      ${formHtml}
      <p style="color:#94a3b8;padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px">No reviews yet. Be the first to share your experience.</p>`;
    bindReviewForm(slug, elig);
    return;
  }

  document.getElementById('reviews-body').innerHTML = `
    ${formHtml}
    <div class="reviews-wrap">
      <aside class="review-summary">
        <div class="big-avg">${avg.toFixed(1)}</div>
        ${starsHtml(avg)}
        <div class="total">Based on ${total} verified review${total === 1 ? '' : 's'}</div>
        <div style="margin-top:16px">
          ${breakdown.map(b => `
            <div class="bar-row">
              <span>${b.n}★</span>
              <div class="bar"><span style="width:${total ? Math.round(b.c/total*100) : 0}%"></span></div>
              <span style="text-align:right">${b.c}</span>
            </div>`).join('')}
        </div>
      </aside>
      <div class="review-list">
        ${reviews.map(r => `
          <article class="review-card">
            <div class="top">
              ${starsHtml(r.rating)}
              <span class="name">${escapeHtml(r.reviewer_name)}</span>
              ${r.is_verified ? '<span class="verified">✓ Verified Buyer</span>' : ''}
              <span class="meta">${r.reviewer_city ? escapeHtml(r.reviewer_city) + ' · ' : ''}${formatDate(r.created_at)}</span>
            </div>
            ${r.title ? `<h4>${escapeHtml(r.title)}</h4>` : ''}
            <p>${escapeHtml(r.body || '')}</p>
          </article>`).join('')}
      </div>
    </div>`;

  bindReviewForm(slug, elig);
}

function renderReviewForm(slug, elig) {
  if (elig && elig.canReview) {
    return `
      <div class="review-form-box">
        <h3>Write a Review</h3>
        <form class="review-form" id="reviewForm" onsubmit="return submitReview(event, '${slug}')">
          <label>Your rating</label>
          <div class="star-pick" id="starPick" data-value="0">
            ${[1,2,3,4,5].map(n => `<svg viewBox="0 0 24 24" data-star="${n}" onclick="pickStar(${n})"><path class="star-empty" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77 5.82 21l1.18-6.88-5-4.87 6.91-1.01z"/></svg>`).join('')}
          </div>
          <label>Title (optional)</label>
          <input type="text" id="rev-title" maxlength="120" placeholder="Sum it up in one line">
          <label>Your review</label>
          <textarea id="rev-body" maxlength="2000" required minlength="10" placeholder="What did you like or dislike? How has it performed?"></textarea>
          <button type="submit" id="rev-submit">Submit Review</button>
        </form>
      </div>`;
  }
  // Locked states
  if (!elig || elig.reason === 'not-logged-in') {
    return `<div class="review-locked">🔒 Only verified buyers can write reviews. <a href="/login.html?next=${encodeURIComponent('/product.html?slug=' + slug)}">Log in</a> to check eligibility.</div>`;
  }
  if (elig.reason === 'no-purchase') {
    return `<div class="review-locked">🔒 Only customers who have <strong>purchased and received</strong> this product can leave a review. <a href="/product.html?slug=${slug}">Buy now</a> to be eligible.</div>`;
  }
  if (elig.reason === 'already-reviewed') {
    return `<div class="review-locked">✓ You have already reviewed this product. Thank you!</div>`;
  }
  return '';
}

function pickStar(n) {
  const sp = document.getElementById('starPick');
  sp.dataset.value = String(n);
  Array.from(sp.querySelectorAll('svg')).forEach(svg => {
    const k = parseInt(svg.dataset.star, 10);
    svg.querySelector('path').setAttribute('class', k <= n ? 'star-fill' : 'star-empty');
  });
}

function bindReviewForm(slug, elig) { /* form is bound via onsubmit */ }

async function submitReview(e, slug) {
  e.preventDefault();
  const rating = parseInt(document.getElementById('starPick').dataset.value || '0', 10);
  if (!rating) { showToast('Please pick a star rating'); return false; }
  const title = document.getElementById('rev-title').value.trim();
  const body  = document.getElementById('rev-body').value.trim();
  if (body.length < 10) { showToast('Review must be at least 10 characters'); return false; }

  const btn = document.getElementById('rev-submit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await fetch('/api/shop/products/' + encodeURIComponent(slug) + '/reviews', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating, title, body }),
    });
    const j = await res.json();
    if (!res.ok) { showToast(j.error || 'Could not submit'); btn.disabled = false; btn.textContent = 'Submit Review'; return false; }
    showToast('Thanks for your review!');
    setTimeout(() => loadReviews(slug), 700);
  } catch (e) {
    showToast('Network error');
    btn.disabled = false; btn.textContent = 'Submit Review';
  }
  return false;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}
function formatDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch { return ''; }
}

function changeQty(delta) {
  const input = document.getElementById('qty');
  const max = window._currentMax || 5;
  let v = (parseInt(input.value) || 0) + delta;
  v = Math.max(0, Math.min(max, v));
  input.value = v;
  // Enable/disable Buy Now based on qty
  const btn = document.getElementById('buyBtn');
  if (btn && !btn.dataset.outOfStock) {
    btn.disabled = (v < 1);
  }
}

function addNow() {
  const qty = Math.max(1, Math.min(5, parseInt(document.getElementById('qty').value) || 0));
  if (qty < 1) return false;
  const cart = getCart();
  const existing = cart.find(i => i.slug === window._currentSlug);
  if (existing) existing.quantity = Math.min(5, existing.quantity + qty);
  else cart.push({ slug: window._currentSlug, quantity: qty });
  setCart(cart);
  showToast(`Added ${qty} to cart`);
  return true;
}

function buyNow() {
  if (!addNow()) return;
  setTimeout(() => window.location.href = '/checkout.html', 400);
}

updateCartCount();
loadProduct();

// Auth-aware nav chip
fetch('/api/shop/me').then(r => r.json()).then(d => {
  if (d.logged_in) {
    var _al = document.getElementById('account-link'); if (_al) _al.href = '/account.html';
    var _alb = document.getElementById('account-label'); if (_alb) _alb.textContent = d.customer.name ? d.customer.name.split(' ')[0] : 'Account';
  }
}).catch(()=>{});
</script>
