<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Knite Product</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0a1628;line-height:1.55}
    a{color:inherit;text-decoration:none}

    .nav{position:sticky;top:0;background:#0a1628;color:#fff;padding:14px 24px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .nav-brand{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:20px;letter-spacing:3px}
    .nav-links{display:flex;gap:24px;align-items:center;font-size:14px}
    .cart-btn{background:rgba(255,255,255,0.08);padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:13px}
    .cart-count{background:#00b4d8;color:#fff;font-weight:700;border-radius:99px;padding:2px 8px;font-size:11px;min-width:22px;text-align:center}

    .crumbs{max-width:1200px;margin:0 auto;padding:20px 24px;font-size:13px;color:#64748b}
    .crumbs a:hover{color:#00b4d8}

    .pdp{max-width:1200px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
    @media(max-width:880px){.pdp{grid-template-columns:1fr;gap:24px}}

    .pdp-img{background:linear-gradient(135deg,#dbeafe,#e0f2fe);border-radius:24px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #e2e8f0}
    .pdp-img svg{width:55%;height:auto}

    .pdp-info h1{font-family:Poppins;font-size:30px;font-weight:800;line-height:1.2;margin-bottom:12px}
    .pdp-brand{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:#00b4d8;font-weight:600;margin-bottom:6px}
    .pdp-desc{color:#475569;font-size:15px;margin-bottom:24px}

    .pdp-price{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
    .price-now{font-family:Poppins;font-size:32px;font-weight:800;color:#0a1628}
    .price-mrp{font-size:18px;color:#94a3b8;text-decoration:line-through}
    .price-off{font-size:13px;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:6px;font-weight:700}
    .price-incl{font-size:12px;color:#94a3b8;margin-bottom:24px}

    .pdp-actions{display:flex;gap:12px;margin-bottom:32px;align-items:center;flex-wrap:wrap}
    .qty-box{display:flex;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
    .qty-btn{background:#f8fafc;border:none;width:40px;height:44px;font-size:18px;cursor:pointer;color:#0a1628}
    .qty-btn:hover{background:#e2e8f0}
    .qty-input{width:48px;text-align:center;border:none;font-weight:600;font-size:15px;background:#fff;color:#0a1628}
    .qty-input:focus{outline:none}

    .btn{padding:13px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn-primary{background:#0a1628;color:#fff}
    .btn-primary:hover{background:#0369a1}
    .btn-cta{background:linear-gradient(135deg,#00b4d8,#0369a1);color:#fff}
    .btn-cta:hover{filter:brightness(1.1)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}

    .pdp-features{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px 24px;margin-bottom:20px}
    .pdp-features h3{font-family:Poppins;font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#0a1628;margin-bottom:14px}
    .pdp-features ul{list-style:none;display:grid;gap:10px}
    .pdp-features li{font-size:14px;color:#0a1628;padding-left:24px;position:relative}
    .pdp-features li::before{content:'✓';position:absolute;left:0;top:0;color:#00b4d8;font-weight:700}

    .trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .trust-item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center;font-size:11px;color:#475569}
    .trust-item .ic{font-size:20px;display:block;margin-bottom:4px}

    .specs{max-width:1200px;margin:0 auto;padding:0 24px 80px}
    .specs h2{font-family:Poppins;font-size:22px;font-weight:700;margin-bottom:18px}
    .specs-grid{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden}
    .spec-row{display:grid;grid-template-columns:200px 1fr;padding:14px 20px;border-bottom:1px solid #f1f5f9;font-size:14px}
    .spec-row:last-child{border-bottom:none}
    .spec-key{color:#64748b;text-transform:capitalize}
    .spec-val{color:#0a1628;font-weight:500}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0a1628;color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.2);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);z-index:200}
    .toast.show{transform:translateX(-50%) translateY(0)}

    .loading{padding:80px;text-align:center;color:#94a3b8}
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-wrap">
    <a href="/" class="nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="navBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0f2b4a"/><stop offset="100%" stop-color="#020617"/></linearGradient></defs>
        <circle cx="32" cy="32" r="32" fill="url(#navBg)"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#00b4d8" stroke-width="0.9" stroke-opacity="0.55"/>
        <text x="32" y="42" text-anchor="middle" font-family="Poppins,Helvetica,Arial" font-weight="800" font-size="26" letter-spacing="-2" fill="#fff">KN</text>
      </svg>
      KNITE<span style="color:#00b4d8">.</span>
    </a>
    <div class="nav-links">
      <a href="/shop.html">Shop</a>
      <a href="/cart.html" class="cart-btn">🛒 Cart <span class="cart-count" id="cart-count">0</span></a>
      <a id="account-link" href="/login.html" class="cart-btn" style="margin-left:6px">👤 <span id="account-label">Sign in</span></a>
    </div>
  </div>
</nav>

<div class="crumbs" id="crumbs">
  <a href="/">Home</a> · <a href="/shop.html">Shop</a> · <span id="crumb-name">Product</span>
</div>

<main id="pdp-root"><div class="loading">Loading product…</div></main>

<div class="toast" id="toast"></div>

<script>
const FMT = n => '₹' + Number(n).toLocaleString('en-IN');
const CART_KEY = 'knite_cart_v1';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch{return[]}}
function setCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartCount()}
function updateCartCount(){document.getElementById('cart-count').textContent=getCart().reduce((s,i)=>s+(i.quantity||0),0)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),2200)}

const PRODUCT_SVG = `
<svg viewBox="0 0 140 180" fill="none">
  <rect x="30" y="20" width="80" height="150" rx="10" fill="#fff" stroke="#0a1628" stroke-width="2.5"/>
  <rect x="45" y="35" width="50" height="65" rx="8" fill="url(#water)"/>
  <text x="70" y="70" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="11" letter-spacing="2">KNITE</text>
  <circle cx="70" cy="118" r="14" fill="#0a1628"/>
  <text x="70" y="123" text-anchor="middle" fill="#fff" font-family="Poppins" font-weight="800" font-size="11">KN</text>
  <rect x="55" y="142" width="30" height="20" rx="3" fill="#e2e8f0"/>
  <defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="65" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#0369a1"/>
  </linearGradient></defs>
</svg>`;

async function loadProduct() {
  const slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { document.getElementById('pdp-root').innerHTML = '<div class="loading">No product selected</div>'; return; }
  try {
    const r = await fetch('/api/shop/products/' + slug);
    if (!r.ok) throw new Error('Product not found');
    const p = await r.json();
    render(p);
  } catch (err) {
    document.getElementById('pdp-root').innerHTML = '<div class="loading">' + err.message + '</div>';
  }
}

function render(p) {
  document.title = p.name + ' — Knite';
  document.getElementById('crumb-name').textContent = p.name;
  const discount = p.mrp > p.selling_price ? Math.round(((p.mrp - p.selling_price)/p.mrp)*100) : 0;
  const out = p.stock <= 0;
  const features = Array.isArray(p.features) ? p.features : [];
  const specs = p.specs && typeof p.specs === 'object' ? p.specs : {};

  document.getElementById('pdp-root').innerHTML = `
    <section class="pdp">
      <div class="pdp-img">${PRODUCT_SVG}</div>
      <div class="pdp-info">
        <div class="pdp-brand">${p.brand || 'Knite'}</div>
        <h1>${p.name}</h1>
        <p class="pdp-desc">${p.long_desc || p.short_desc || ''}</p>

        <div class="pdp-price">
          <span class="price-now">${FMT(p.selling_price)}</span>
          ${discount > 0 ? `<span class="price-mrp">${FMT(p.mrp)}</span><span class="price-off">${discount}% OFF</span>` : ''}
        </div>
        <div class="price-incl">Inclusive of all taxes · Free installation · 1-year warranty</div>

        <div class="pdp-actions">
          <div class="qty-box">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input type="number" id="qty" class="qty-input" value="1" min="1" max="5">
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn btn-primary" onclick="addNow()" ${out ? 'disabled' : ''}>${out ? 'Out of stock' : '🛒 Add to Cart'}</button>
          <button class="btn btn-cta" onclick="buyNow()" ${out ? 'disabled' : ''}>${out ? '—' : 'Buy Now →'}</button>
        </div>

        ${features.length ? `
          <div class="pdp-features">
            <h3>What's Included</h3>
            <ul>${features.map(f => `<li>${f}</li>`).join('')}</ul>
          </div>
        ` : ''}

        <div class="trust">
          <div class="trust-item"><span class="ic">🚚</span>Free Delivery</div>
          <div class="trust-item"><span class="ic">🔧</span>Free Installation</div>
          <div class="trust-item"><span class="ic">🛡️</span>1-Yr Warranty</div>
        </div>
      </div>
    </section>

    ${Object.keys(specs).length ? `
    <section class="specs">
      <h2>Specifications</h2>
      <div class="specs-grid">
        ${Object.entries(specs).map(([k,v]) => `
          <div class="spec-row">
            <div class="spec-key">${k.replace(/_/g,' ')}</div>
            <div class="spec-val">${v}</div>
          </div>`).join('')}
      </div>
    </section>` : ''}
  `;

  window._currentSlug = p.slug;
  window._currentMax = Math.min(5, Math.max(1, p.stock));
}

function changeQty(delta) {
  const input = document.getElementById('qty');
  const max = window._currentMax || 5;
  let v = (parseInt(input.value) || 1) + delta;
  v = Math.max(1, Math.min(max, v));
  input.value = v;
}

function addNow() {
  const qty = Math.max(1, Math.min(5, parseInt(document.getElementById('qty').value) || 1));
  const cart = getCart();
  const existing = cart.find(i => i.slug === window._currentSlug);
  if (existing) existing.quantity = Math.min(5, existing.quantity + qty);
  else cart.push({ slug: window._currentSlug, quantity: qty });
  setCart(cart);
  showToast(`Added ${qty} to cart`);
}

function buyNow() {
  addNow();
  setTimeout(() => window.location.href = '/checkout.html', 400);
}

updateCartCount();
loadProduct();

// Auth-aware nav chip
fetch('/api/shop/me').then(r => r.json()).then(d => {
  if (d.logged_in) {
    document.getElementById('account-link').href = '/account.html';
    document.getElementById('account-label').textContent = d.customer.name ? d.customer.name.split(' ')[0] : 'Account';
  }
}).catch(()=>{});
</script>
</body>
</html>
