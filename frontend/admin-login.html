<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knite Admin – Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a1628;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #0f2035;
    border: 1px solid #1e3a55;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    font-size: 28px; font-weight: 800;
    color: #00d4aa;
    margin-bottom: 4px;
  }
  .logo span { color: #fff; }
  .subtitle {
    text-align: center;
    font-size: 13px; color: #64b5f6;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px; color: #90a4ae;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 18px 0 6px;
  }
  input {
    width: 100%;
    background: #0a1628;
    border: 1px solid #1e3a55;
    border-radius: 8px;
    padding: 11px 14px;
    color: #fff; font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #00d4aa; }
  button {
    width: 100%;
    margin-top: 24px;
    background: #00d4aa;
    color: #0a1628;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 16px;
    padding: 10px 12px;
    background: rgba(244, 67, 54, 0.12);
    border: 1px solid rgba(244, 67, 54, 0.4);
    color: #ff7770;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">KNITE <span>Admin</span></div>
  <div class="subtitle">Sign in to continue</div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submitBtn" type="submit">Sign In</button>
    <div class="error" id="errorBox"></div>
  </form>
</div>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('submitBtn');

  // If already logged in, redirect to dashboard
  fetch('/api/admin/me', { credentials: 'same-origin' })
    .then(r => { if (r.ok) window.location.href = '/admin.html'; })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: form.username.value.trim(),
          password: form.password.value,
        }),
      });
      const data = await r.json();
      if (!r.ok) {
        errorBox.textContent = data.error || 'Login failed';
        errorBox.style.display = 'block';
        return;
      }
      window.location.href = '/admin.html';
    } catch (err) {
      errorBox.textContent = 'Network error: ' + err.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
