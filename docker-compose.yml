version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: knite-postgres
    environment:
      POSTGRES_DB: knite
      POSTGRES_USER: knite
      POSTGRES_PASSWORD: knite_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: knite-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://knite:knite_secret@postgres:5432/knite
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
