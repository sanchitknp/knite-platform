version: '3.8'

services:
  # Local Postgres — only starts with `docker compose --profile local-db up`.
  # On EC2 (pilot) we skip this and point the backend at RDS via DATABASE_URL
  # in backend/.env (uploaded by infra/deploy.sh from Terraform output).
  postgres:
    image: postgres:15-alpine
    container_name: knite-postgres
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: knite
      POSTGRES_USER: knite
      POSTGRES_PASSWORD: knite_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: knite-backend
    env_file:
      - ./backend/.env
    # DATABASE_URL comes from backend/.env (local: points to postgres container;
    # EC2: points to RDS). REDIS_URL is fixed since redis is still colocated.
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
