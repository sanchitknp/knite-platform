<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seller Service Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='54' font-family='Arial' fill='white' text-anchor='middle'>S</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
  <!-- ─── AUTH ─────────────────────────────────────────────── -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand brand-lg">
        <span class="logo">S</span>
        <div><b>Seller Service Portal</b><small>post-sales ops for e-commerce sellers</small></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-authtab="login">Log in</button>
        <button class="tab" data-authtab="signup">Sign up</button>
      </div>

      <form id="loginForm" class="authform">
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Log in</button>
        <p class="err" id="loginErr"></p>
      </form>

      <form id="signupForm" class="authform hidden">
        <label>Business name<input name="business_name" required /></label>
        <label>Your name<input name="contact_name" /></label>
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Phone<input name="phone" /></label>
        <label>Password <small>(min 8 chars)</small><input type="password" name="password" required minlength="8" autocomplete="new-password" /></label>
        <button class="btn primary" type="submit">Create account</button>
        <p class="err" id="signupErr"></p>
      </form>
    </div>
  </div>

  <!-- ─── APP ──────────────────────────────────────────────── -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">S</span>
        <div><b>Seller Portal</b></div>
      </div>
      <nav>
        <a class="navlink active" data-view="dashboard">📊 Dashboard</a>
        <a class="navlink" data-view="support" data-perm="support.read">🎧 Sales &amp; Support</a>
        <a class="navlink" data-view="listings" data-perm="listings.read">🏷️ Listings</a>
        <a class="navlink" data-view="products" data-perm="settings.manage">📦 Products</a>
        <a class="navlink" data-view="safety" data-perm="safety.read">🛡️ Safety Claims</a>
        <a class="navlink" data-view="team" data-perm="team.manage">👥 Team</a>
        <a class="navlink" data-view="roles" data-perm="team.manage">🔑 Roles</a>
        <a class="navlink" data-view="settings" data-perm="settings.manage">⚙️ Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div id="bizName" class="biz"></div>
        <button class="btn ghost sm" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
        <button class="btn primary sm" id="linksBtn">🔗 Request links</button>
        <span id="userEmail" class="muted"></span>
      </header>
      <section id="viewRoot" class="viewroot"></section>
    </main>
  </div>

  <!-- Modal host -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js" defer></script>
</body>
</html>
